android.enableJetifier=true
android.injected.testOnly=false
android.useAndroidX=true
# Android 16 兼容: 16KB 页对齐 / 16KB page alignment for Android 16
android.experimental.enable16kbPageAlignment=true
kapt.verbose=true
kotlin.code.style=official
kotlin.parallel.tasks.in.project=true
kotlin.incremental.useClasspathSnapshot=true
org.gradle.caching=true
# configureondemand 与 AGP 8.7.3 + compileSdk 36 组合下触发
# "Cannot query the value of this provider" (compileDebugJavaWithJavac 依赖解析失败, 09-17 CI 根因之三)
#org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 \
--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.parallel=true
# org.gradle.unsafe.configuration-cache=true
# AGP 9 移除了该开关（buildConfig 已在 build.gradle.kts 的 buildFeatures 里开启）
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# AGP 9 起「资源优化收缩」默认开启，但它要求资源 ID 非 final，与上面的 nonFinalResIds=false 冲突，
# minifyReleaseWithR8 会直接失败（Optimized resource shrinking requires non-final IDs）。
# 这里关掉优化收缩、保留 final 资源 ID，与 4.0.65 及更早的 release 行为一致；
# 日后确实要迁移到非 final 资源 ID 时，把这一行删掉并改 nonFinalResIds=true。
android.r8.optimizedResourceShrinking=false
android.enableR8.fullMode=true
# 网络抖动兜底: gradle 对下载失败默认零重试, 一条连接被掐全盘崩 (09-16 CI 全红根因之一)
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500

# AGP 9 默认启用内置 Kotlin 支持，会拒绝显式应用 org.jetbrains.kotlin.android。
android.builtInKotlin=false
# AGP 9 默认启用新 DSL，与显式 org.jetbrains.kotlin.android 插件不兼容；
# 先用官方过渡开关绕过，后续再迁移到 AGP 内置 Kotlin（AGP 10 会移除该开关）
android.newDsl=false
android.builtInKotlin=false
