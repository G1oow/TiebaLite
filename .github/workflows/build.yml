name: Build & Release APK

# 触发策略
#   - workflow_dispatch：手动构建；可选「同时发布到 Releases」，填入 tag 即可发版，
#     不填则用 application.properties 的 versionName 自动拼成 vX.Y.Z。
#   - push tag v*：发版自动化（与手动发布走同一套发布步骤）。
# 分支 push 不触发——避免日常提交反复占用 Actions 额度。
#
# 发布产物使用仓库内固定的发布签名（app/tblite_debug.jks），
# 构建期由 :app:checkReleaseSigning 校验证书 SHA-256，发布前再用 apksigner 复核 APK 的实际签名，
# 任一环节不符即中止，避免「同版本号、不同签名」导致用户无法覆盖升级。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空则用 v{versionName}，例如 v4.0.63）'
        required: false
        default: ''
      publish:
        description: '构建后发布到 GitHub Release'
        type: boolean
        default: true
      prerelease:
        description: '标记为预发布（prerelease）'
        type: boolean
        default: false
  push:
    tags: ['v*']

# 同一 tag / 同一分支只保留最新一次运行，避免重复构建抢占 runner
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      # 固定发布签名的口令（keystore 本身随仓库分发：
      # 它只保证「同名包可持续升级」，不是防伪手段）。
      TBLITE_KEYSTORE_PASSWORD: tiebalite
      TBLITE_KEY_PASSWORD: tiebalite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 内存调优必须排在缓存步骤之前：setup-gradle 的缓存 key 由 gradle.properties 等
      # 构建文件的哈希决定，先改文件再算 key，否则每次运行 key 都对不上、缓存永不命中。
      # GitHub runner 7G/2C：Gradle daemon 压到 2048m 给编译期让路，Kotlin daemon 4096m
      # （编译期峰值所在），workers.max=1 砍掉并行 worker JVM 峰值。追加同名键后者胜出。
      - name: Tune Gradle for release build
        run: |
          printf '\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED\nkotlin.daemon.jvmargs=-Xmx4096m\norg.gradle.workers.max=1\n' >> gradle.properties
          echo "=== gradle.properties 尾部（确认覆盖生效）==="
          tail -6 gradle.properties

      # 依赖与 build cache：此前完全没有缓存，每次运行都要从官方 Maven 全量下载依赖再全量
      # 编译（实测「Build release APK」一步独占 12 分钟）。setup-gradle 会缓存 Gradle User
      # Home（依赖 / wrapper）与本地 build cache（gradle.properties 已开 org.gradle.caching），
      # 后续运行的大量任务可直接 FROM-CACHE，只需重跑真正变更的部分。
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # runner 镜像自带 Android SDK（/usr/local/lib/android/sdk，含 cmdline-tools），
      # 接受 licenses 后由 AGP 按 compileSdk 自行补装 platform / build-tools；
      # 显式补装 platforms;android-36 + build-tools;36.0.0 兜底。
      # （不用 android-actions/setup-android@v3：其内部安装已废弃的 'tools' 包，
      #   在新版 cmdline-tools 下必失败，实测 exit 1）
      - name: Set up Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools"

      # sweet-dependency 配置把官方源覆盖成了 aliyun 国内镜像（为 Codeberg/国内网络加的），
      # GitHub runner 在海外，拉镜像超时/不可用导致插件标记 artifact 解析失败。
      # CI 侧改回官方默认源——只改工作副本，不入库。
      - name: Use official repositories on CI
        run: |
          python3 - <<'EOF'
          p = 'gradle/sweet-dependency/sweet-dependency-config.yaml'
          s = open(p, encoding='utf-8').read()
          for mirror, official in (
              ('https://maven.aliyun.com/repository/gradle-plugin', 'https://plugins.gradle.org/m2'),
              ('https://maven.aliyun.com/repository/google', 'https://dl.google.com/dl/android/maven2'),
              ('https://maven.aliyun.com/repository/public', 'https://repo.maven.apache.org/maven2'),
          ):
              s = s.replace(mirror, official)
          open(p, 'w', encoding='utf-8').write(s)
          print('repositories switched to official sources')
          EOF
          grep -A 12 "^repositories:" gradle/sweet-dependency/sweet-dependency-config.yaml

      # 发布签名由 build.gradle.kts 固定指向 app/tblite_debug.jks；
      # assembleRelease 依赖 checkReleaseSigning，签名缺失或证书指纹不符会直接失败。
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain clean assembleRelease --stacktrace
          echo "=== 构建产物 ==="
          ls -lh app/build/outputs/apk/release/

      # 二次校验：直接读 APK 里的签名证书，确认与发布契约一致
      # （防止 Gradle 侧配置被绕过、或错误地签成本机 debug key）。
      - name: Verify APK signature
        run: |
          SDK=/usr/local/lib/android/sdk
          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-certs.txt
          EXPECTED=F7E02F10C7C9E83B943F8DEEE786B270330416C710CF5CFBCE73027AD19DA759
          if ! grep -qi "SHA-256 digest: $EXPECTED" apk-certs.txt; then
            echo "::error::APK 签名证书与发布契约不符（期望 SHA-256 $EXPECTED）"
            exit 1
          fi
          echo "APK 签名校验通过"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 解析发布参数：tag 推送用 ref 名，手动触发用输入或 versionName。
      - name: Resolve release inputs
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              VERSION_NAME=$(grep -E '^versionName=' application.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
              [ -n "$VERSION_NAME" ] || { echo "::error::无法从 application.properties 读取 versionName"; exit 1; }
              TAG="v$VERSION_NAME"
            fi
            PUBLISH="${{ inputs.publish }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PUBLISH="true"
            case "$TAG" in *-ai*) PRERELEASE="true" ;; *) PRERELEASE="false" ;; esac
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "发布参数: tag=$TAG publish=$PUBLISH prerelease=$PRERELEASE"

      # 发布：gh CLI 预装在 runner，凭据用自动注入的 GITHUB_TOKEN。
      # 不删旧 release——已存在则更新说明并 clobber 覆盖资产，避免「删了建不回」的半程状态。
      - name: Publish to GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NOTES=$(awk -v tag="$TAG" 'index($0, "## " tag " ") == 1 || $0 == "## " tag {found=1; next} found && index($0, "## ") == 1 {exit} found {print}' AI_CHANGELOG.md)
          CN=$(printf '%s\n' "$NOTES" | awk 'index($0,"### ")==1 && /中文/{found=1; next} index($0,"### ")==1 {found=0} found')
          [ -n "$CN" ] || CN="TiebaLite $TAG"
          printf '%s\n' "$CN" > notes.md
          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md $PRERELEASE_FLAG
          else
            # 手动触发时 tag 可能尚不存在：显式指定 target 让 gh 一并创建
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md $PRERELEASE_FLAG
          fi
          echo "published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
